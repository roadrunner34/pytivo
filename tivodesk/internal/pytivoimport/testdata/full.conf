stray = before any section

# A pyTivo.conf that exercises everything the importer handles.
[Server]
port = 9032
MAX_VIDEO_BR = 17408k
ffmpeg = C:\pyTivo\bin\ffmpeg.exe
ffmpeg_pram = -threads 2 %(video_br)s -x a=b
tivo_mak = 1234567890
togo_path = D:\TiVo Recordings
tivolibre = C:\pyTivo\bin\tivolibre.exe
beacon: 192.168.1.255 listen
audio_br = 192K
audio_br = 320K
; a comment in the other style

[_tivo_HD]
video_br = 12Mi
bufsize = huge

[_tivo_sd]
aspect169 = false

[_tivo_7460001902A1B2C]
aspect169 = true
shares = Movies, Missing
tivo_mak = 0987654321

[Movies]
type = video
path = D:\Movies
note = first line
    second line

[Tunes]
type = Music
path = D:\Music

[Empty]
type = photo

[Admin]
type = settings

[Stray]
colour = blue

[_tivo_7460001902A1B2C]
audio_lang = fre

[loggers]
keys = root

[logger_root]
level = DEBUG
